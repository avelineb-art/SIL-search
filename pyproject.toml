[project]
name = "sil-provider-research"
version = "0.1.0"
description = "Compliant lead-research system for identifying Australian SIL providers whose public website does not clearly state NDIS registration status."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "tenacity>=8.2",
    "selectolax>=0.3",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.6",
    "tldextract>=5.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
dashboard = [
    "streamlit>=1.35",
    "pandas>=2.2",
]

[project.scripts]
sil-research = "sil_research.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
